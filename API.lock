theorem Inkproof.Scale.Affine.apply_lt_apply_iff_of_neg : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (t : Inkproof.Scale.Affine α), t.slope < 0 → ∀ {x y : α}, t.apply x < t.apply y ↔ y < x
theorem Inkproof.Scale.Affine.apply_lt_apply_iff_of_pos : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (t : Inkproof.Scale.Affine α), 0 < t.slope → ∀ {x y : α}, t.apply x < t.apply y ↔ x < y
def Inkproof.Scale.Affine.comp : {α : Type u} → [Add α] → [Mul α] → Inkproof.Scale.Affine α → Inkproof.Scale.Affine α → Inkproof.Scale.Affine α
theorem Inkproof.Scale.Affine.comp_apply : ∀ {α : Type u} [inst : Lean.Grind.Field α] (g f : Inkproof.Scale.Affine α) (x : α), (g.comp f).apply x = g.apply (f.apply x)
theorem Inkproof.Scale.Affine.comp_assoc : ∀ {α : Type u} [inst : Lean.Grind.Field α] (h g f : Inkproof.Scale.Affine α), (h.comp g).comp f = h.comp (g.comp f)
theorem Inkproof.Scale.Affine.comp_id : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.comp Inkproof.Scale.Affine.id = t
theorem Inkproof.Scale.Affine.comp_inv : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.slope ≠ 0 → t.comp t.inv = Inkproof.Scale.Affine.id
def Inkproof.Scale.Affine.id : {α : Type u} → [OfNat α 0] → [OfNat α 1] → Inkproof.Scale.Affine α
theorem Inkproof.Scale.Affine.id_apply : ∀ {α : Type u} [inst : Lean.Grind.Field α] (x : α), Inkproof.Scale.Affine.id.apply x = x
theorem Inkproof.Scale.Affine.id_comp : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), Inkproof.Scale.Affine.id.comp t = t
def Inkproof.Scale.Affine.inv : {α : Type u} → [OfNat α 1] → [Div α] → [Neg α] → Inkproof.Scale.Affine α → Inkproof.Scale.Affine α
theorem Inkproof.Scale.Affine.inv_apply_apply : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.slope ≠ 0 → ∀ (x : α), t.inv.apply (t.apply x) = x
theorem Inkproof.Scale.Affine.inv_comp : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.slope ≠ 0 → t.inv.comp t = Inkproof.Scale.Affine.id
theorem Inkproof.Scale.Affine.inv_eq : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.inv = { slope := t.slope⁻¹, offset := -(t.offset * t.slope⁻¹) }
theorem Inkproof.Scale.Affine.inv_inv : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.slope ≠ 0 → t.inv.inv = t
