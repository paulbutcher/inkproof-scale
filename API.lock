theorem Inkproof.Scale.Affine.rebase_apply_float_error : ∀ (t : Inkproof.Scale.Affine Float) (o x : Float) {a w b d : Rat}, Inkproof.Core.Float.toRat t.slope = Option.some a → Inkproof.Core.Float.toRat o = Option.some w → Inkproof.Core.Float.toRat x = Option.some b → Inkproof.Core.Float.toRat t.offset = Option.some d → Inkproof.Core.NormalRange (a * w) → (∀ (po : Rat), Inkproof.Core.Float.toRat (t.slope * o) = Option.some po → Inkproof.Core.NormalRange (po + d)) → Inkproof.Core.NormalRange (b - w) → (∀ (xo : Rat), Inkproof.Core.Float.toRat (x - o) = Option.some xo → Inkproof.Core.NormalRange (a * xo)) → (∀ (pm c' : Rat), Inkproof.Core.Float.toRat (t.slope * (x - o)) = Option.some pm → Inkproof.Core.Float.toRat (t.slope * o + t.offset) = Option.some c' → Inkproof.Core.NormalRange (pm + c')) → ∃ q, Inkproof.Core.Float.toRat ((t.rebase o).apply (x - o)) = Option.some q ∧ Inkproof.Core.ratAbs (q - (a * b + d)) ≤ (Inkproof.Core.ratAbs (a * (b - w)) + Inkproof.Core.ratAbs (a * w) + Inkproof.Core.ratAbs d) / Inkproof.Core.scaleTwoPow 1 50
