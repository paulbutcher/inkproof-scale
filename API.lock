structure Inkproof.Scale.Affine : Type u → Type u
def Inkproof.Scale.Affine.apply : {α : Type u} → [Add α] → [Mul α] → Inkproof.Scale.Affine α → α → α
theorem Inkproof.Scale.Affine.apply_eq : ∀ {α : Type u} [inst : Add α] [inst_1 : Mul α] (t : Inkproof.Scale.Affine α) (x : α), t.apply x = t.slope * x + t.offset
theorem Inkproof.Scale.Affine.apply_inj : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.slope ≠ 0 → ∀ {x y : α}, t.apply x = t.apply y ↔ x = y
theorem Inkproof.Scale.Affine.apply_inv_apply : ∀ {α : Type u} [inst : Lean.Grind.Field α] (t : Inkproof.Scale.Affine α), t.slope ≠ 0 → ∀ (y : α), t.apply (t.inv.apply y) = y
theorem Inkproof.Scale.Affine.apply_le_apply_iff_of_neg : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (t : Inkproof.Scale.Affine α), t.slope < 0 → ∀ {x y : α}, t.apply x ≤ t.apply y ↔ y ≤ x
