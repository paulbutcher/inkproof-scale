theorem Inkproof.Scale.Linear.inv_eq : ∀ {α : Type u} (s : Inkproof.Scale.Linear α), s.inv = { domainStart := s.rangeStart, domainEnd := s.rangeEnd, rangeStart := s.domainStart, rangeEnd := s.domainEnd }
theorem Inkproof.Scale.Linear.inv_inv : ∀ {α : Type u} (s : Inkproof.Scale.Linear α), s.inv.inv = s
theorem Inkproof.Scale.Linear.inv_map_map : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α), s.domainStart ≠ s.domainEnd → s.rangeStart ≠ s.rangeEnd → ∀ (x : α), s.inv.map (s.map x) = x
def Inkproof.Scale.Linear.map : {α : Type u} → [Add α] → [Sub α] → [Mul α] → [Div α] → Inkproof.Scale.Linear α → α → α
theorem Inkproof.Scale.Linear.map_domainEnd : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α), s.domainStart ≠ s.domainEnd → s.map s.domainEnd = s.rangeEnd
theorem Inkproof.Scale.Linear.map_domainStart : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α), s.map s.domainStart = s.rangeStart
theorem Inkproof.Scale.Linear.map_eq : ∀ {α : Type u} [inst : Add α] [inst_1 : Sub α] [inst_2 : Mul α] [inst_3 : Div α] (s : Inkproof.Scale.Linear α) (x : α), s.map x = s.rangeStart + (x - s.domainStart) * (s.rangeEnd - s.rangeStart) / (s.domainEnd - s.domainStart)
theorem Inkproof.Scale.Linear.map_inv_map : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α), s.domainStart ≠ s.domainEnd → s.rangeStart ≠ s.rangeEnd → ∀ (y : α), s.map (s.inv.map y) = y
theorem Inkproof.Scale.Linear.map_le_map_iff_of_decreasing : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (s : Inkproof.Scale.Linear α), s.domainStart < s.domainEnd ∧ s.rangeEnd < s.rangeStart ∨ s.domainEnd < s.domainStart ∧ s.rangeStart < s.rangeEnd → ∀ {x y : α}, s.map x ≤ s.map y ↔ y ≤ x
theorem Inkproof.Scale.Linear.map_le_map_iff_of_increasing : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (s : Inkproof.Scale.Linear α), s.domainStart < s.domainEnd ∧ s.rangeStart < s.rangeEnd ∨ s.domainEnd < s.domainStart ∧ s.rangeEnd < s.rangeStart → ∀ {x y : α}, s.map x ≤ s.map y ↔ x ≤ y
theorem Inkproof.Scale.Linear.map_lt_map_iff_of_decreasing : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (s : Inkproof.Scale.Linear α), s.domainStart < s.domainEnd ∧ s.rangeEnd < s.rangeStart ∨ s.domainEnd < s.domainStart ∧ s.rangeStart < s.rangeEnd → ∀ {x y : α}, s.map x < s.map y ↔ y < x
theorem Inkproof.Scale.Linear.map_lt_map_iff_of_increasing : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (s : Inkproof.Scale.Linear α), s.domainStart < s.domainEnd ∧ s.rangeStart < s.rangeEnd ∨ s.domainEnd < s.domainStart ∧ s.rangeEnd < s.rangeStart → ∀ {x y : α}, s.map x < s.map y ↔ x < y
constructor Inkproof.Scale.Linear.mk : {α : Type u} → α → α → α → α → Inkproof.Scale.Linear α
field Inkproof.Scale.Linear.rangeEnd : {α : Type u} → Inkproof.Scale.Linear α → α
field Inkproof.Scale.Linear.rangeStart : {α : Type u} → Inkproof.Scale.Linear α → α
def Inkproof.Scale.Linear.toAffine : {α : Type u} → [Sub α] → [Mul α] → [Div α] → Inkproof.Scale.Linear α → Inkproof.Scale.Affine α
theorem Inkproof.Scale.Linear.toAffine_apply : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α) (x : α), s.toAffine.apply x = s.map x
theorem Inkproof.Scale.Linear.toAffine_eq : ∀ {α : Type u} [inst : Sub α] [inst_1 : Mul α] [inst_2 : Div α] (s : Inkproof.Scale.Linear α), s.toAffine = have slope := (s.rangeEnd - s.rangeStart) / (s.domainEnd - s.domainStart); { slope := slope, offset := s.rangeStart - slope * s.domainStart }
theorem Inkproof.Scale.Linear.toAffine_inv : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α), s.domainStart ≠ s.domainEnd → s.rangeStart ≠ s.rangeEnd → s.inv.toAffine = s.toAffine.inv
theorem Inkproof.Scale.Linear.toAffine_slope_ne_zero : ∀ {α : Type u} [inst : Lean.Grind.Field α] (s : Inkproof.Scale.Linear α), s.domainStart ≠ s.domainEnd → s.rangeStart ≠ s.rangeEnd → s.toAffine.slope ≠ 0
theorem Inkproof.Scale.Linear.toAffine_slope_neg : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (s : Inkproof.Scale.Linear α), s.domainStart < s.domainEnd ∧ s.rangeEnd < s.rangeStart ∨ s.domainEnd < s.domainStart ∧ s.rangeStart < s.rangeEnd → s.toAffine.slope < 0
theorem Inkproof.Scale.Linear.toAffine_slope_pos : ∀ {α : Type u} [inst : Lean.Grind.Field α] [inst_1 : LE α] [inst_2 : LT α] [Std.LawfulOrderLT α] [inst_4 : Std.IsLinearOrder α] [Lean.Grind.OrderedRing α] (s : Inkproof.Scale.Linear α), s.domainStart < s.domainEnd ∧ s.rangeStart < s.rangeEnd ∨ s.domainEnd < s.domainStart ∧ s.rangeEnd < s.rangeStart → 0 < s.toAffine.slope
