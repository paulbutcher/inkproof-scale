# Required status check for every library and consumer repository.
# Agents' tokens have no Workflows permission, so they cannot edit this file.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash with -eo pipefail

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If your repositories are private, Lake needs a read-only token to fetch
      # dependencies: store one as the DEPS_READ_TOKEN secret and uncomment.
      # - name: Credentials for private dependencies
      #   run: git config --global url."https://x-access-token:${{ secrets.DEPS_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Internal dependencies pinned to release tags
        run: scripts/check-pins.sh

      - name: Build, failing on sorry
        run: |
          lake build 2>&1 | tee build.log
          if grep -q "declaration uses 'sorry'" build.log; then
            echo "::error::A declaration uses sorry"
            exit 1
          fi

      # Lasm tests run where the test subproject pins Lasm in test/package-lock.json.
      - name: Install Node for Lasm
        if: hashFiles('test/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install Lasm
        if: hashFiles('test/package-lock.json') != ''
        working-directory: test
        run: npm ci --no-fund --no-audit

      - name: Tests
        env:
          # Fail, rather than skip with a warning, if Lasm is pinned but missing.
          INKPROOF_REQUIRE_LASM: ${{ hashFiles('test/package-lock.json') != '' && '1' || '' }}
        run: lake test

      - name: API lock is up to date
        run: |
          if [ -x scripts/api-lock.sh ]; then
            scripts/api-lock.sh > API.lock.generated
            diff -u API.lock API.lock.generated
          else
            echo "::warning::scripts/api-lock.sh not implemented yet; skipping"
          fi
